<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Guilherme Marques</title>
        <link rel="stylesheet" href="styles/style.css">
        <script type="module" src="scripts/i18n.js" defer></script>
        <script src="scripts/terminal.js"></script>
        <script src="scripts/script.js" defer></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
    <body>
        <header class="header">
            <h2><span class="header__terminal-logo animated-text">gui@developer:~$</span></h2>
            <button class="header__nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>
            <nav class="header__nav">
                <a href="#hero"><h3 class="header__nav-home">Home</h3></a>
                <a href="#projects"><h3 class="header__nav-projects">Projects</h3></a>
                <h3 class="header__nav-contact">Contact</h3>
                <h3 class="header__nav-change-language">Change Language</h3>
            </nav>
        </header>

        <div class="dots-bg"></div>
        
        <section id="hero" class="hero">
            <div class="hero__info-container">
                <h1 class="hero__info-container__title">
                    <span class="hero__title-text"></span>
                    <span class="hero__name"></span>
                </h1>
                <h2 class="hero__info-container__subtitle"></h2>
                <div class="hero__info-container__socials">
                    <a href="https://www.linkedin.com/in/gui-r-marques/" target="_blank">
                        <i class="fa-brands fa-linkedin linkedin-icon"></i><p>LinkedIn</p>
                    </a>
                    <a href="https://github.com/Sol-Gui" target="_blank">
                        <i class="fa-brands fa-github github-icon"></i><p>GitHub</p>
                    </a>
                    <a href="#contact-me" class="open-to-work">
                        <i class="fa-solid fa-briefcase"></i><p class="hero__social-open-to-work"></p>
                    </a>
                </div>
            </div>
            <div class="hero__terminal">
                <terminal-window id="term">
                    <div class="hero__info-card" id="terminal-info-card" style="display: none;">

                         <div class="hero__info-card-profile">
                            <img src="https://avatars.githubusercontent.com/u/177280156?s=400&u=4252e8dae775fe27f349f5d77b13835507336bc9&v=4" class="hero__info-card-avatar" alt="Guilherme Marques">

                            <div class="hero__info-card-identity">
                                <h3 class="hero__info-card-name">
                                </h3>

                                <p class="hero__info-card-role">
                                </p>
                            </div>
                        </div>

                        <div class="hero__info-card-details">

                            <div class="hero__info-card-detail">
                                <i class="fa-solid fa-code"></i>
                                <span class="hero__info-card-detail-backend"></span>
                            </div>

                            <div class="hero__info-card-detail">
                                <i class="fa-solid fa-microchip"></i>
                                <span class="hero__info-card-detail-systems"></span>
                            </div>

                            <div class="hero__info-card-detail">
                                <i class="fa-solid fa-calendar"></i>
                                <span class="hero__info-card-detail-period"></span>
                            </div>

                        </div>

                        <div class="hero__info-card-stats">

                            <div class="hero__info-card-stat">
                                <span class="hero__info-card-stat-elapsed-label"></span>
                                <h4 class="hero__info-card-stat-elapsed-value"></h4>
                            </div>

                            <div class="hero__info-card-stat">
                                <span class="hero__info-card-stat-remaining-label"></span>
                                <h4 class="hero__info-card-stat-remaining-value"></h4>
                            </div>

                        </div>

                        <p class="hero__info-card-update">
                        </p>

                    </div>
                </terminal-window>
            </div>
        </section>
        <section id="projects" class="projects">
            <h1 class="projects__title"></h1>
            <div class="projects-container">
                <a class="projects-terminal-link" href="projects/JacacultMap/">
                <terminal-window class="projects-terminal">
                    <div class="projects-interface">
                        <div class="projects-interface__header">
                            <div class="projects-interface__window-icons" aria-hidden="true">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <h2 class="projects-interface__title-jacacultmap"></h2>
                            <i class="fa-solid fa-star" aria-hidden="true"></i>
                        </div>
                        <h3 class="projects-interface__description-jacacultmap"></h3>
                        <p class="projects-interface__stack projects-interface__stack-jacacultmap"></p>
                        <span class="projects-interface__details-link projects-interface__details-link-jacacultmap"></span>
                    </div>
                </terminal-window>
                </a>
                <a class="projects-terminal-link" href="projects/ZMiniChain/">
                <terminal-window class="projects-terminal">
                    <div class="projects-interface">
                        <div class="projects-interface__header">
                            <div class="projects-interface__window-icons" aria-hidden="true">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <h2 class="projects-interface__title-zminichain"></h2>
                            <i class="fa-solid fa-star" aria-hidden="true"></i>
                        </div>
                        <h3 class="projects-interface__description-zminichain"></h3>
                        <p class="projects-interface__stack projects-interface__stack-zminichain"></p>
                        <span class="projects-interface__details-link projects-interface__details-link-zminichain"></span>
                    </div>
                </terminal-window>
                </a>
            </div>
        </section>
        <script defer>
            async function runTerminal() {
                const term = document.getElementById('term').api;

                await term.type('gui@developer:~$ ',      { cls: 'prompt' });
                await term.type('sudo status --verbose', { cls: 'cmd', speed: 55 });
                await term.newline();
                await term.print('[sudo] password for gui: ······', { cls: 'cyan',  delay: 300 });
                await term.print('● Fetching profile data...',        { cls: 'cmd',   delay: 400 });
                await term.print('✔ Connection established',          { cls: 'ok',    delay: 100 });
                await term.print('✔ Status: S&T STUDENT @ UNIFESP',   { cls: 'ok',    delay: 100 });
                await term.print('✔ Focus: Computer Science',     { cls: 'ok',    delay: 100 });

                await term.reveal('#terminal-info-card', 300);
            }
            document.addEventListener('DOMContentLoaded', async () => {
                runTerminal();
            });
        </script>

    </body>
</html>
